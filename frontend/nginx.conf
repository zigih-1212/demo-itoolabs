# Конфигурация nginx для VoxDesk.
#
# Задачи nginx в этом приложении:
#   1) отдавать собранную статику SPA;
#   2) для путей вида /calls, /contacts (клиентская маршрутизация Vue Router)
#      возвращать index.html — иначе при обновлении страницы будет 404;
#   3) проксировать /api на backend-контейнер, чтобы фронтенд и API жили
#      на одном домене (нет проблем с CORS, куки работают «как надо»).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Сжатие статики — заметно ускоряет загрузку для пользователя.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Ассеты Vite содержат хэш в имени (index-a1b2c3.js), поэтому их можно
    # кэшировать «навсегда» — при изменении файла меняется и имя.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API проксируем на сервис `backend` (имя из docker-compose).
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-фолбэк: любой неизвестный путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
